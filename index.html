<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portafolio · Tópico 2</title>
<style>
:root{--bg:#070711;--panel:#0f0f22;--line:#24244a;--tx:#e8e8ff;--mut:#8f8fb8;
--cy:#00e5ff;--mg:#ff2bd6;--vi:#8a5cff;--gr:#39ff88;--am:#ffb02e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 15% -10%,#2a0f4a55,transparent),radial-gradient(800px 500px at 100% 10%,#00e5ff1f,transparent),var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
/* hero */
.hero{display:grid;gap:22px;align-items:center;grid-template-columns:1.1fr 1fr}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.tag{color:var(--cy);letter-spacing:.3em;font-size:.75rem;text-transform:uppercase}
h1{font-size:clamp(2rem,6vw,3.4rem);margin:.2em 0;line-height:1.05;background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);line-height:1.6;margin:0}
.screen{border:1px solid var(--vi);border-radius:16px;background:#0a0a1aee;box-shadow:0 0 28px #8a5cff55,inset 0 0 30px #8a5cff1c;overflow:hidden}
.bar{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line)}
.bar i{width:9px;height:9px;border-radius:50%;background:var(--mg)}.bar i:nth-child(2){background:var(--am)}.bar i:nth-child(3){background:var(--gr)}
.term{padding:16px;font-family:Consolas,monospace;font-size:.85rem;line-height:1.8;color:var(--gr)}
.term b{color:var(--cy);font-weight:400}.term em{color:var(--mg);font-style:normal}
.cur{display:inline-block;width:8px;height:1em;background:var(--gr);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* secciones */
h2{margin:44px 0 16px;font-size:1.1rem;color:var(--mut);font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{--c:var(--cy);text-align:left;color:var(--tx);background:var(--panel);border:1px solid var(--c);border-radius:16px;padding:22px;position:relative;overflow:hidden;box-shadow:0 0 0 #0000;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent)}
.card .n{font-size:3rem;font-weight:800;color:var(--c);text-shadow:0 0 18px var(--c);line-height:1}
.card h3{margin:10px 0 4px}.card span{color:var(--mut);font-size:.9rem}
.card .go{position:absolute;right:18px;top:20px;color:var(--c);font-size:1.4rem;transition:transform .25s}
.card:hover .go{transform:translateX(5px)}
/* lista */
.back{background:none;border:1px solid var(--line);color:var(--tx);padding:8px 14px;border-radius:999px;transition:.2s}
.back:hover{border-color:var(--cy);color:var(--cy)}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 22px}
.head h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:0}
.add{margin-left:auto;background:transparent;border:1px dashed var(--gr);color:var(--gr);padding:8px 14px;border-radius:999px}
.add:hover{background:#39ff8818}
.list{display:grid;gap:12px}
.file{display:flex;gap:16px;align-items:center;width:100%;text-align:left;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:.2s}
.file:hover,.file.on{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent);transform:translateX(4px)}
.file b{display:block}.file small{color:var(--mut);display:block;margin-top:2px;line-height:1.4}
.file em{margin-left:auto;font-style:normal;font-size:.72rem;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 9px}
.ico{--c:var(--cy);color:var(--c);flex:none;width:44px;height:44px;filter:drop-shadow(0 0 6px var(--c));animation:float 3s ease-in-out infinite}
.file:hover .ico{animation:wiggle .6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes wiggle{25%{transform:rotate(-8deg) scale(1.1)}75%{transform:rotate(8deg) scale(1.1)}}
.t-doc{--c:var(--cy)}.t-png{--c:var(--mg)}.t-jpg{--c:var(--am)}.t-html{--c:var(--vi)}.t-py{--c:var(--gr)}
/* visor */
.viewer{margin-top:22px;border:1px solid var(--c,var(--cy));border-radius:16px;background:#0a0a1a;box-shadow:0 0 30px color-mix(in srgb,var(--c,var(--cy)) 40%,transparent);overflow:hidden;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.vh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.vh .ico{width:26px;height:26px;animation:none}
.vh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{margin-left:auto;background:none;border:1px solid var(--mg);color:var(--mg);width:32px;height:32px;border-radius:50%;font-size:1rem;transition:.2s}
.x:hover{background:var(--mg);color:#000;transform:rotate(90deg)}
.vb{max-height:70vh;overflow:auto}
.vb img{display:block;max-width:100%;margin:0 auto}
.vb iframe{width:100%;height:60vh;border:0;background:#fff}
.vb pre{margin:0;padding:16px;color:var(--gr);font-family:Consolas,monospace;font-size:.85rem;line-height:1.6;overflow-x:auto}
.vb .doc{padding:22px;background:#f4f4fb;color:#15152a;line-height:1.6}
.vb .doc h1,.vb .doc h2{color:#3b1d8f;background:none;-webkit-text-fill-color:#3b1d8f;text-transform:none;letter-spacing:0;font-size:1.3rem;margin:0 0 .6em}
.vb .doc table{border-collapse:collapse;margin:.8em 0}.vb .doc td,.vb .doc th{border:1px solid #b9b9d0;padding:5px 9px}.vb .doc img{max-width:100%}
.msg{padding:30px;text-align:center;color:var(--mut)}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <div class="hero">
      <div>
        <div class="tag">Materia · Tópico 2</div>
        <h1>Portafolio de trabajos</h1>
        <p>Una colección de mis actividades, prácticas y proyectos del curso, organizada por parcial. Elige una sección para explorar los archivos.</p>
      </div>
      <div class="screen">
        <div class="bar"><i></i><i></i><i></i></div>
        <div class="term">
          <div><b>$</b> whoami</div>
          <div><em>estudiante@topico2</em></div>
          <div><b>$</b> ls parciales/</div>
          <div>parcial_1/ parcial_2/ parcial_3/</div>
          <div><b>$</b> abrir portafolio<span class="cur"></span></div>
        </div>
      </div>
    </div>
    <h2>Secciones</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section id="sec" class="hide">
    <div class="head">
      <button class="back" id="back">← Inicio</button>
      <h1 id="stitle"></h1>
          </div>
    <div class="list" id="list"></div>
    <div id="viewer"></div>
  </section>
</div>

<script>
const ICONS={
doc:'<path d="M14 6h22l10 10v32a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"/><path d="M36 6v10h10M18 26h20M18 33h20M18 40h13"/>',
png:'<rect x="8" y="10" width="48" height="44" rx="6"/><circle cx="22" cy="24" r="4"/><path d="M8 46l16-14 12 10 8-7 12 11"/>',
jpg:'<rect x="8" y="10" width="48" height="44" rx="6"/><circle cx="44" cy="24" r="6"/><path d="M8 48l14-12 10 8 10-6 14 10"/>',
html:'<path d="M22 20L10 32l12 12M42 20l12 12-12 12M36 14L28 50"/>',
py:'<path d="M32 8c-10 0-10 4-10 8v6h12v3H16c-5 0-8 4-8 11s3 11 8 11h4v-7c0-4 3-7 7-7h12c3 0 6-3 6-6V16c0-5-6-8-13-8z"/><path d="M32 56c10 0 10-4 10-8v-6H30v-3h18c5 0 8-4 8-11s-3-11-8-11h-4v7c0 4-3 7-7 7H25c-3 0-6 3-6 6v12c0 5 6 8 13 8z"/>'
};
function icon(t){return '<svg class="ico t-'+t+'" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">'+ICONS[t]+'</svg>'}

/* ====== EDITA AQUÍ ======
   Una línea por archivo. file = ruta respecto a index.html (sin espacios ni acentos; respeta mayúsculas).
   type: doc | png | jpg | html | py   (para Word usa .docx) */
const DATA={
1:[
 {type:'doc',title:'Inteligencia',file:'Primer parcial/Inteligencia.docx',desc:'Documento de Word sobre el tema de inteligencia.'},
 {type:'doc',title:'Documental: El dinero no lo es todo',file:'Primer parcial/Documental, el dinero no lo es todo.docx',desc:'Documento de Word sobre el documental.'},
 {type:'jpg',title:'Infografía: 7 hábitos de la gente altamente productiva',file:'Primer parcial/infografia 7 habitos de la gente altamente productiva (primer parcial).jpg',desc:'Infografía del libro de los 7 hábitos.'},
 {type:'png',title:'Carlos Kasuga',file:'Primer parcial/Carlos kasuga.png',desc:'Imagen sobre Carlos Kasuga.'},
 {type:'png',title:'Yokoi Kenji',file:'Primer parcial/Yokoi Kenji.png',desc:'Imagen sobre Yokoi Kenji.'},
 {type:'html',title:'App 7 hábitos',file:'Primer parcial/app 7 habitos/index.html',desc:'Aplicación web sobre los 7 hábitos.'},
 {type:'html',title:'App filosofía México y Japón',file:'Primer parcial/app filosofia mex jap/index.html',desc:'Aplicación web sobre filosofía de México y Japón.'},
 {type:'py',title:'App análisis estratégico',file:'Primer parcial/app analisis (estatico)/analisis_estrategico.py',desc:'Aplicación en Python de análisis estratégico (FODA, Ishikawa, Pareto y más).'}
],
2:[
 {type:'doc',title:'Amazon',file:'Segundo parcial/Amazon.docx',desc:'Documento de Word sobre Amazon.'},
 {type:'doc',title:'Tabla comparativa',file:'Segundo parcial/Tabla comparativa.docx',desc:'Documento de Word con una tabla comparativa.'},
 {type:'html',title:'App países',file:'Segundo parcial/app paises.html',desc:'Aplicación web sobre países.'},
 {type:'html',title:'Código limpio',file:'Segundo parcial/Código limpio.html',desc:'Aplicación web basada en el libro Código limpio.'},
 {type:'html',title:'El cuerpo del empresario ideal',file:'Segundo parcial/El cuerpo del empresario ideal.html',desc:'Aplicación web sobre el cuerpo del empresario ideal.'}
],
3:[
 {type:'doc',title:'Creatividad',file:'Tercer parcial/Creatividad.docx',desc:'Documento de Word sobre creatividad.'},
 {type:'doc',title:'Importancia directiva',file:'Tercer parcial/Importancia directiva.docx',desc:'Documento de Word sobre la importancia directiva.'},
 {type:'html',title:'Arquetipos sistémicos',file:'Tercer parcial/arquetipos-sistemicos.html',desc:'Aplicación web sobre los arquetipos sistémicos.'},
 {type:'html',title:'Los cuatro pilares de la educación',file:'Tercer parcial/Los cuatro pilares de la educación.html',desc:'Aplicación web sobre los cuatro pilares de la educación.'},
 {type:'html',title:'Negociación',file:'Tercer parcial/Negociacion.html',desc:'Aplicación web sobre negociación.'},
 {type:'html',title:'Simulador de negociación',file:'Tercer parcial/Simulador de negociación.html',desc:'Simulador interactivo de negociación.'},
 {type:'html',title:'Taller de la creatividad',file:'Tercer parcial/Taller de la creatividad.html',desc:'Actividades creativas del taller.'},
 {type:'png',title:'Imagen de arquetipos',file:'Tercer parcial/img1.png',desc:'Imagen de apoyo de la app de arquetipos sistémicos.'},
 {type:'png',title:'Segundo día de exposiciones',file:'Tercer parcial/Segundo dia exposiciones.png',desc:'Imagen del segundo día de exposiciones.'}
]
};
const SEC={1:{c:'#00e5ff',t:'Primer parcial',d:'Fundamentos y primeras prácticas'},2:{c:'#ff2bd6',t:'Segundo parcial',d:'Desarrollo y diseño'},3:{c:'#39ff88',t:'Tercer parcial',d:'Proyecto integrador'}};
const $=id=>document.getElementById(id);
let cur=null,openIdx=null,seq=0;

$('cards').innerHTML=[1,2,3].map(n=>'<button class="card" style="--c:'+SEC[n].c+'" data-n="'+n+'"><span class="go">→</span><div class="n">0'+n+'</div><h3>'+SEC[n].t+'</h3><span>'+SEC[n].d+' · '+DATA[n].length+' archivos</span></button>').join('');
$('cards').onclick=e=>{const b=e.target.closest('.card');if(b)showSec(+b.dataset.n)};
$('back').onclick=goHome;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showSec(n){cur=n;closeViewer();$('home').classList.add('hide');$('sec').classList.remove('hide');$('stitle').textContent=SEC[n].t;renderList();window.scrollTo(0,0)}
function goHome(){closeViewer();cur=null;$('sec').classList.add('hide');$('home').classList.remove('hide')}
function renderList(){
  $('list').innerHTML=!DATA[cur].length?'<div class="msg">Aún no hay archivos en esta sección.</div>':DATA[cur].map((f,i)=>'<button class="file t-'+f.type+(i===openIdx?' on':'')+'" data-i="'+i+'">'+icon(f.type)+'<span><b>'+esc(f.title)+'</b><small>'+esc(f.desc)+'</small></span><em>.'+f.type+'</em></button>').join('');
}
$('list').onclick=e=>{const b=e.target.closest('.file');if(b)openFile(+b.dataset.i)};
function closeViewer(){seq++;openIdx=null;$('viewer').innerHTML='';if(cur)renderList()}
function loadScript(u){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
async function getMammoth(){
  if(window.mammoth)return window.mammoth;
  for(const u of ['https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js','https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js']){
    try{await loadScript(u);if(window.mammoth)return window.mammoth}catch(e){}
  }
  throw new Error('lib');
}
function msg(t){return '<div class="msg">'+t+'</div>'}
function shell(f,body){return '<div class="viewer t-'+f.type+'"><div class="vh">'+icon(f.type)+'<b>'+esc(f.file.split('/').pop())+'</b><button class="x" id="cl" aria-label="Cerrar">✕</button></div><div class="vb">'+body+'</div></div>'}
async function openFile(i){
  closeViewer();            // cierra la pestaña anterior
  openIdx=i;renderList();
  const f=DATA[cur][i],tok=++seq,url=encodeURI(f.file);
  $('viewer').innerHTML=shell(f,msg('Cargando…'));$('cl').onclick=closeViewer;
  let body;
  try{
    if(f.type==='png'||f.type==='jpg')body='<img src="'+url+'" alt="'+esc(f.title)+'">';
    else if(f.type==='html')body='<iframe sandbox="allow-scripts allow-same-origin" src="'+url+'"></iframe>';
    else if(f.type==='py'){const r=await fetch(url);if(!r.ok)throw 0;body='<pre>'+esc(await r.text())+'</pre>'}
    else if(/\.docx$/i.test(f.file)){const r=await fetch(url);if(!r.ok)throw 0;const buf=await r.arrayBuffer();const m=await getMammoth();let x;try{x=await m.convertToHtml({arrayBuffer:buf})}catch(err){throw new Error('fmt')}body='<div class="doc">'+x.value+'</div>'}
    else body=msg('Los archivos .doc antiguos no se pueden previsualizar. Guárdalo como .docx.');
  }catch(e){
    const k=e&&e.message;let t;
    if(k==='lib')t='No se pudo cargar el lector de Word. Revisa tu conexión a internet.';
    else if(k==='fmt')t='El archivo no es un .docx válido. Si es un .doc antiguo, ábrelo en Word y guárdalo como .docx.';
    else if(location.protocol==='file:')t='El navegador bloquea leer archivos al abrir la página con doble clic. Ábrela desde GitHub Pages o con un servidor local (python -m http.server).';
    else t='No se pudo cargar “'+esc(f.file)+'”. Revisa que el nombre y la ruta coincidan exactamente (mayúsculas, acentos y extensión).';
    body=msg(t+'<p><a href="'+url+'" target="_blank" style="color:var(--cy)">Abrir el archivo en otra pestaña</a></p>');
  }
  if(tok!==seq)return;
  $('viewer').innerHTML=shell(f,body);$('cl').onclick=closeViewer;
  $('viewer').scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
